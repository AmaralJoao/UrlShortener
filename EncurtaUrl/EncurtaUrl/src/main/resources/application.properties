spring.application.name=EncurtaUrl

# Configuração do DataSource para MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/DbEncurtaUrl
spring.datasource.username=root
spring.datasource.password=Marioviado1@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

logging.level.com.yourpackage=DEBUG
logging.level.org.springframework.transaction=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Necessário para compatibilidade de rotas no Springdoc/OpenAPI
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# URL base usada na geração da URL encurtada
app.base-url=http://localhost:8080